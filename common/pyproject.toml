[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dk9mbs-iot"
version = "0.1.0"
description = "Gemeinsamer Code von IoT-Dashboard und Agenten (REST-Abfragen, Auswertungsregeln)"
requires-python = ">=3.9"
dependencies = ["requests>=2.31"]

[tool.setuptools]
packages = ["dk9mbs_iot", "dk9mbs_iot.query"]
